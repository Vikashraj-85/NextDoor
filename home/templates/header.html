{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxuryStay - Premium Hotel Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- bootsstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/profile_modal.css' %}">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/card.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/host_room.css' %}"> 
    <link rel="stylesheet" href="{% static 'css/service.css' %}">
    <link rel="stylesheet" href="{% static 'css/review.css' %}">
    <link rel="stylesheet" href="{% static 'css/payment.css' %}">
    <link rel="stylesheet" href="{% static 'css/forget_reset.css' %}">


</head>

<body class=" bg-body-tertiary">

    <!-- Navbar -->
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid align-items-center justify-content-around">
            <a href="/" class="text-decoration-none"><div class="logo navbar-brand">NextDoor</div></a>
            <div class="  ">
                <ul class="nav-menu  mt-3">
                    <li><a href="{% url 'home' %}">Home</a></li>
                    <!-- <li><a href="#rooms">Rooms</a></li> -->
                    <li><a href="{% url 'services' %}">Services</a></li>
                    <!-- <li><a href="#about">About</a></li> -->
                    <li><a href="{% url 'contact' %}">Contact</a></li>

                    {% if user.is_authenticated %}
                    
                    <li id="drop-down-vk-1"><a href="">
                            <div style="display: flex; align-items: start; justify-content: center; "
                                id="drop-down-toggle">
                                    
                                      <img src="{% static 'media/profile_1.avif' %}" alt="profile-img" id="profile-1" width="35px" style="border-radius: 50%;" height="35px">
                                    
                            </div>
                        </a>
                        <div id="profile-drop-down-1" style="width: 170px; height: 130px; margin-top:1rem ;">
                            <a href="#" data-bs-toggle="modal" data-bs-target="#rkProfileModal">Edit profile</a>
                            <a href="{% url 'host_room' %}">Host room</a>
                            <a href="{% url 'logout' %}">logout</a>
                        </div>
                    </li>
                    {% else %}

                    <li><a href="{% url 'login' %}">Log in</a></li>
                    <li><a href="{% url 'signup' %}">Sign up</a></li>
                    {% endif %}
                </ul>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

        </div>
    </nav>

    <!-- ---------- edit profile modal--------->





    <!-- MODAL -->
    <div class="modal fade" id="rkProfileModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content rk-modal-box">

                <div class="rk-modal-header">

                    <h2 class="rk-modal-title">
                     Hii Mr.  {{user}}
                    </h2>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="rk-modal-body">

                    <form method="POST" enctype="multipart/form-data"  action="{% url 'profile' %}">

                        {% csrf_token %}

                        <!-- PHONE -->
                        <div class="rk-input-group">

                            <label class="rk-label">
                                Phone Number
                            </label>

                            <input type="text" name="phone" class="rk-form-input" placeholder="Enter phone number">

                        </div>

                        <!-- CITY -->
                        <div class="rk-input-group">

                            <label class="rk-label">
                                City
                            </label>

                            <input type="text" name="city" class="rk-form-input" placeholder="Enter city">

                        </div>

                        <!-- IMAGE -->
                        <div class="rk-input-group">

                            <label class="rk-label">
                                Profile Image
                            </label>

                            <input type="file" name="profile_image" class="rk-form-input">

                        </div>

                        <button class="rk-save-btn">

                            Save Profile

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>
